<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        a{
            color: yellow;
            text-decoration: none;
        }
         ul li{

            list-style-type: none;
            background-color: green;
            display: inline;
         }

         div{
            background-color: aliceblue;
            display: inline;
         }

         span{
            background-color: black;
            display: block;
         }
    </style>
</head>
<body>

    <!-- styling list elements -->
     <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
    </ul>

    <ol>
        <li>Mango</li>
    </ol>

    <!-- block -div
    inline -span -->

    <div style="background-color: red;"> I am div</div>
    <span style="background-color: aqua;">I am span</span>
</body>
</html>
