<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contain{
            height:71vh;
            width: 90%;
            background-color: rgb(106, 179, 206);
            border: 2px solid black;
            border-radius: 11px;
            position: relative;
            top: 10px;
            padding: 15px;


        }

        .pic{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        

        .circle{
            background-color: red;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            position: absolute;
            right: 20px;
            bottom: 140px;

        

        }
        h1,p{
            font-style: italic;
            align-items: start;


        }

        .pp{
            padding: auto;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button{
            background-color: purple;
            color: white;
            font-weight: bold;
            border-radius: 11px;
           padding: 10px 15px;
           
        }
    </style>
</head>
<body>
    <div class="contain">

        <div class="pic"><img src="https://dam.activeadventures.com/image/upload/v1744258142/ezqktiazuup8p6gbxdlq.jpg" alt="" height="300px"></div>

        <div class="circle"></div>

        <div>
        <h1>Pokhara</h1>

        <p>Pokhara is a beautyful place. Lorem ipsum dolor sit. Lorem ipsum dolor sit amet consectetur adipisicing elit. Itaque ab cum est saepe architecto repudiandae?</p>
        </div>

        <div class="pp">
            <p>Price: <span style="color: green;">Rs 999</span></p>
            <button>Buy now</button>
        </div>
    
 
    </div>
    

</body>
</html>
