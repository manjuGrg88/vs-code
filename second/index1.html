<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: aquamarine;
            color: black;
        }

        p{
            color: brown;
        }
        div{
            color: blue;
        }
        .para{
            color: chartreuse;
            background-color: forestgreen;
        }
        .green{
            background-color: rebeccapurple;

        }

        #only{
            color: black;
            background-color: palevioletred;
        }

        
    </style>
</head>
<body>
    <h1>Heading</h1>
    <p>I am paragraph</p>
    <div>I am div</div>

    <p class="para">hello</p>
    <p class="para">hi</p>
    <p class="para green">namaste</p>
    <p class="para">bye</p>
    <p class="para">good</p>
    <p id="only">ok</p>


</body>
</html>
