<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: khaki;
        }
        .content{
            background-color: aliceblue;
            height: 50vh;
            padding: 15px;
            width: 70%;
            

        }

        .sum{
            padding: 10px;
            font-style: normal;
            border: 1px solid rgb(234, 230, 230);
            border-radius: 20px;
            
        }

        h1{
            font-weight: bold;
        }

        .sub1{
            display: flex;
            justify-content: space-between;
            
        }

        .sub2{
            display: flex;
            justify-content: space-between;


        }

        .sub3{
            font-weight: bold;
            display: flex;
            justify-content: space-between;

        }
        button{
            background-color: orangered;
            color: aliceblue;
            font-size: large;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p1{
            display: flex;
            align-items: center;
            justify-content: center;

        }
    </style>
</head>
<body>
    <div class="content">
            <div class="sum">
                <h2>Order Summary</h2>

                 <div class="sub1">
                    <h>Subtotal </h>
                    <p>Rs.2400</p>  
                    
                 </div>

                <div class="sub2">
                  <h>Delivery fee </h> 
                  <p>Rs.100</p>
                </div>

                <div class="sub3">
                    <h>Total</h> 
                    <p style="color: orangered;">Rs. 2500</p>
            </div>

            <button>Proceed to checkout</button>

            <p1>-continue shoppiong</p1>


        

    </div>
</body>
</html>
