<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: black;
        }
        .container{
            padding: 10px;
            background-color: whitesmoke;
            height: 100vh;
            width: 100vh;
            display: grid;
            grid-template-columns:repeat(3,1fr) ;
            grid-template-rows: repeat(2,1fr);
            gap: 15px;
        }

        .box1,.box2,.box3,.box4,.box5,.box6{
            border-radius: 15px;
           

        }

        .box1{
            background-color: burlywood;
        }
        .box2{
            background-color: rgb(87, 154, 231);
        }
        .box3{
            background-color: aquamarine;
        }
        .box4{
            background-color: navy;
        }
        .box5{
            background-color: orange;
        }
        .box6{
            background-color: palevioletred;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        
    </div>
</body>
</html>
