<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(75, 196, 196);
            height: 100vh;
            display: grid;
            /* grid-template-columns: 100px 300px 500px ; */
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: 1fr 1fr 1fr;


        }

        .box{
            background-color: red;
            color: chartreuse;
            height: 70px;
            width: 70px;
            

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div  class="box">3</div>
        <div class="box">4</div>
        <div class="box"> 5</div>


    </div>
</body>
</html>
